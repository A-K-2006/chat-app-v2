server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Demo assets must not be heuristic-cached, or a stale app.js/index.html mismatch
    # shows an empty ID box. Always revalidate.
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
