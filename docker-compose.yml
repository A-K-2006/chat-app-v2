name: relay

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: docker
  EUREKA_URI: http://eureka:8761/eureka
  ZIPKIN_URL: http://zipkin:9411/api/v2/spans
  JWT_SECRET: relay-dev-secret-change-me-please-0123456789abcdef

x-scrape: &scrape
  prometheus.scrape: "true"

networks:
  relay-net:
    driver: bridge

volumes:
  pgdata-auth:
  pgdata-chat:
  pgdata-history:
  redisdata:
  kafkadata:
  grafanadata:

services:
  eureka:
    build:
      context: .
      args:
        MODULE: discovery-server
    image: relay/discovery-server
    ports:
      - "18761:8761"
    environment:
      <<: *service-env
      EUREKA_HOSTNAME: eureka
    networks: [relay-net]
    labels:
      <<: *scrape
      prometheus.port: "8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    image: relay/gateway
    ports:
      - "18080:8080"
    environment:
      <<: *service-env
      REDIS_HOST: redis
    depends_on:
      eureka:
        condition: service_healthy
    networks: [relay-net]
    labels:
      <<: *scrape
      prometheus.port: "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    image: relay/auth-service
    ports:
      - "18081:8081"
    environment:
      <<: *service-env
    depends_on:
      eureka:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
    networks: [relay-net]
    labels:
      <<: *scrape
      prometheus.port: "8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  chat-service:
    build:
      context: .
      args:
        MODULE: chat-service
    image: relay/chat-service
    deploy:
      replicas: 2
    expose:
      - "8082"
    environment:
      <<: *service-env
    depends_on:
      eureka:
        condition: service_healthy
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [relay-net]
    labels:
      <<: *scrape
      prometheus.port: "8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  history-service:
    build:
      context: .
      args:
        MODULE: history-service
    image: relay/history-service
    ports:
      - "18083:8083"
    environment:
      <<: *service-env
    depends_on:
      eureka:
        condition: service_healthy
      postgres-history:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [relay-net]
    labels:
      <<: *scrape
      prometheus.port: "8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  presence-service:
    build:
      context: .
      args:
        MODULE: presence-service
    image: relay/presence-service
    ports:
      - "18084:8084"
    environment:
      <<: *service-env
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [relay-net]
    labels:
      <<: *scrape
      prometheus.port: "8084"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "15432:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
      - ./ops/db/auth/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [relay-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-chat:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "15433:5432"
    volumes:
      - pgdata-chat:/var/lib/postgresql/data
      - ./ops/db/chat/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [relay-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d chatdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-history:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: historydb
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "15434:5432"
    volumes:
      - pgdata-history:/var/lib/postgresql/data
      - ./ops/db/history/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [relay-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d historydb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    networks: [relay-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "19092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "12"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks: [relay-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./ops/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"
    networks: [relay-net]

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "19411:9411"
    networks: [relay-net]

  prometheus:
    image: prom/prometheus:v2.53.1
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "19090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [relay-net]

  frontend:
    image: nginx:alpine
    ports:
      - "18088:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    networks: [relay-net]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "13000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [relay-net]
